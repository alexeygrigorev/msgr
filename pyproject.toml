[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msgr"
version = "0.1.0"
description = "Read SMS from a connected Android phone (ADB) as a local CLI inbox with read-archiving"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["sms", "adb", "android", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Communications",
]

[project.scripts]
msgr = "msgr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
